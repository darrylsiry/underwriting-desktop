<!doctype html><html lang="en"><head><meta charset="utf-8"><title>UX-004 Rating inputs with units</title>
<style>
body{margin:0;padding:24px;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#0f172a;background:#f8fafc}
h1{font-size:18px;margin:0 0 4px}p.lead{color:#64748b;margin:0 0 20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:0 0 8px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:0;padding:8px 16px;border-bottom:1px solid #f1f5f9;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#64748b}
.in{display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#0f172a;font-size:14px;overflow:hidden}
.in span{padding:6px 8px}.in .v{flex:1;text-align:right;font-variant-numeric:tabular-nums}.in .u{color:#64748b;background:#f8fafc;border-left:1px solid #e2e8f0}.in .p{color:#64748b;background:#f8fafc;border-right:1px solid #e2e8f0}
.in .l{flex:1;text-align:left}
</style></head><body>
<h1>UX-004 — Format money and percent inputs with separators and units</h1>
<p class="lead">Workbench › Rating inputs. <code>parseInputs</code> already strips <code>$ , %</code>, so the formatted defaults round-trip unchanged.</p>
<div class="cols">
<div><h2>Before</h2><div class="card"><h3>Rating inputs</h3><div class="grid">
<label>Class code<span class="in"><span class="l">98304</span></span></label>
<label>Gross receipts<span class="in"><span class="l">2300000</span></span></label>
<label>States of operation<span class="in"><span class="l">AZ, NV</span></span></label>
<label>Home state (SL tax)<span class="in"><span class="l">AZ</span></span></label>
<label>Each occurrence<span class="in"><span class="l">1000000</span></span></label>
<label>General aggregate<span class="in"><span class="l">2000000</span></span></label>
<label>Deductible<span class="in"><span class="l">0</span></span></label>
<label>Residential %<span class="in"><span class="l">100</span></span></label>
<label>Subcontracted %<span class="in"><span class="l">0</span></span></label>
<label>COIs required from subs<span class="in"><span class="l">yes</span></span></label>
<label>Max height (ft)<span class="in"><span class="l">0</span></span></label>
<label>Experience mod<span class="in"><span class="l">1</span></span></label>
</div></div></div>
<div><h2>After</h2><div class="card"><h3>Rating inputs</h3><div class="grid">
<label>Class code<span class="in"><span class="l">98304</span></span></label>
<label>Gross receipts<span class="in"><span class="p">$</span><span class="v">2,300,000</span></span></label>
<label>States of operation<span class="in"><span class="l">AZ, NV</span></span></label>
<label>Home state (SL tax)<span class="in"><span class="l">AZ</span></span></label>
<label>Each occurrence<span class="in"><span class="p">$</span><span class="v">1,000,000</span></span></label>
<label>General aggregate<span class="in"><span class="p">$</span><span class="v">2,000,000</span></span></label>
<label>Deductible<span class="in"><span class="p">$</span><span class="v">0</span></span></label>
<label>Residential<span class="in"><span class="v">100</span><span class="u">%</span></span></label>
<label>Subcontracted<span class="in"><span class="v">0</span><span class="u">%</span></span></label>
<label>COIs required from subs<span class="in"><span class="l">yes</span></span></label>
<label>Max height<span class="in"><span class="v">0</span><span class="u">ft</span></span></label>
<label>Experience mod<span class="in"><span class="v">1.00</span><span class="u">×</span></span></label>
</div></div></div>
</div></body></html>
