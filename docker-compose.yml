# Local stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uw
      POSTGRES_PASSWORD: uw
    ports: ["127.0.0.1:5432:5432"]   # localhost only: never expose the demo database on the network
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uw"]
      interval: 2s
      retries: 30

  rating:
    build: ./services/rating
    environment:
      DATABASE_URL: postgresql://uw:uw@db:5432/rating
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:   # healthy once migrations ran and the active rate version loads
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      retries: 20

  ingestion:
    build: ./services/ingestion
    environment:
      # The Claude Code cloud sandbox reserves ANTHROPIC_API_KEY; there the key is UW_ANTHROPIC_API_KEY.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${UW_ANTHROPIC_API_KEY:-}}
      RATING_SERVICE_URL: http://rating:8000
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-opus-5-5}
    ports: ["127.0.0.1:8002:8000"]
    depends_on:
      rating: { condition: service_healthy }   # Claude may only pick rateable class codes from /classes
    volumes:
      - ./samples:/samples:ro   # for `python -m app.score /samples` and demo uploads

  web:
    build: ./web
    environment:
      CUSTOMER_DATABASE_URL: postgresql://uw:uw@db:5432/customer
      POLICY_DATABASE_URL: postgresql://uw:uw@db:5432/policy
      RATING_SERVICE_URL: http://rating:8000
      INGESTION_SERVICE_URL: http://ingestion:8000
      SUBMISSION_INBOX_DIR: /inbox
      # The desk's AI assistant (step 21) calls Claude from the web app: same key as ingestion (CR-078).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${UW_ANTHROPIC_API_KEY:-}}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
    volumes:
      # Broker drop folder shown in the Submissions inbox. Writable: when fewer than five submissions
      # are waiting the app generates more into it (step 20); those folders are git-ignored.
      - ./samples/submissions:/inbox
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      rating: { condition: service_healthy }
      ingestion: { condition: service_started }

volumes:
  pgdata:
