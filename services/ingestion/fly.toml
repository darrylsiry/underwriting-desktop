# Ingestion service: private (Flycast only), like rating. ANTHROPIC_API_KEY is a Fly secret.
app = "uwdesk-ingestion"
primary_region = "iad"

[env]
  EXTRACTION_MODEL = "claude-opus-5-5"
  RATING_SERVICE_URL = "http://uwdesk-rating.flycast"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"               # PDF parsing plus the Anthropic client
  cpu_kind = "shared"
  cpus = 1
