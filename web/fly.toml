# UW Desktop: the only public app, behind HTTP Basic auth (BASIC_AUTH_USER/PASSWORD secrets).
# Database URLs are secrets set by `fly mpg attach`; the services are private Flycast addresses.
app = "uwdesk-web"
primary_region = "iad"

[env]
  RATING_SERVICE_URL = "http://uwdesk-rating.flycast"
  INGESTION_SERVICE_URL = "http://uwdesk-ingestion.flycast"
  RATING_ADMIN_URL = "/admin"
  # This deployment's public names, canonical first (SEC-022/024): the same-origin and MCP checks
  # accept these and nothing else, and absolute links use the listed name a request came in on
  # (else the first), never an unlisted Host header. uwdesktop.siryous.app is the custom domain
  # (fly certs list -a uwdesk-web); list every name the app answers on, or posts from an unlisted
  # one get 403. scripts/fly-deploy.sh overrides this for another FLY_PREFIX. RATING_ADMIN_TOKEN is
  # a secret the script sets on web and rating (SEC-002).
  PUBLIC_BASE_URL = "https://uwdesktop.siryous.app,https://uwdesk-web.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/live"         # liveness only; /api/health is 503 while a service is down
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
