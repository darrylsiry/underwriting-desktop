# UW Desktop: the only public app, behind HTTP Basic auth (BASIC_AUTH_USER/PASSWORD secrets).
# Database URLs are secrets set by `fly mpg attach`; the services are private Flycast addresses.
app = "uwdesk-web"
primary_region = "iad"

[env]
  RATING_SERVICE_URL = "http://uwdesk-rating.flycast"
  INGESTION_SERVICE_URL = "http://uwdesk-ingestion.flycast"
  RATING_ADMIN_URL = "/admin"
  # The one public origin (SEC-022/024): absolute links, the API's own URLs and the same-origin and
  # MCP Origin checks use this, never a forwarded Host header. scripts/fly-deploy.sh overrides it
  # for another FLY_PREFIX. RATING_ADMIN_TOKEN is a secret the script sets on web and rating (SEC-002).
  PUBLIC_BASE_URL = "https://uwdesk-web.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/live"         # liveness only; /api/health is 503 while a service is down
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
